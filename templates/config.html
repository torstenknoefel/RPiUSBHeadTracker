<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    {{> head.html}}
</head>
<body>
    {{> menu.html}}
    <main class="responsive">
        <center>
            <h1>Configuration</h1>
            <form action="/config" method="post">
                <label for="device">Joystick device:</label><input type="text" class="responsive round " id="device" name="device" value="{{device}}" /><br /><br />
                <input type="reset" class="responsive round" value="Reset">
                <input type="submit" class="responsive round medium-height" name="action" value="Set">
                <input type="submit" class="responsive round medium-height" name="action" value="Save">
            </form>
        </center>
    </main>
</body>
</html>
