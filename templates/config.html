<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Config</title>
</head>
<body>
    <center>
        <h1>Configuration</h1>
        <form action="/config" method="post">
            <label for="device">Joystick device:</label>
            <input type="text" id="device" name="device" value="{{device}}" /><br /><br />
            <input type="reset" value="Reset">
            <input type="submit" name="action" value="Set">
            <input type="submit" name="action" value="Save">
        </form>
    </center>
</body>
</html>
