<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    {{> head.html}}
</head>
<body>
    {{> menu.html}}
    <main class="responsive">
       

        <form action="/config" method="post">
            <fieldset class="border round label">
                <legend>System</legend>
                <div class="field border  label">
                    <input type="text" id="device" name="device" value="{{device}}" />
                    <label>Joystick device</label>
                </div>
                <div class="field border  label">
                    <input type="text" id="ip" name="ip" value="{{ip}}" />
                    <label>Web Server Address</label>
                </div>
                <div class="field border  label">
                    <input type="number" id="port" name="port" value="{{port}}" />
                    <label>Web Server Port</label>
                </div>
            </fieldset>
            <fieldset class="border round label">
                <legend>Camera</legend>
                <div class="field border  label">
                    <input type="number" id="cam" name="cam" value="{{cam}}" />
                    <label>Device No</label>
                </div>
                <label class="checkbox">
                    <input type="checkbox" id="cam_verbose" name="cam_verbose" value="{{cam_verbose}}" />
                    <span>Verbose Log</span>
                </label>
                <div class="field border  label">
                    <input type="number" id="cam_width" name="cam_width" value="{{cam_width}}" />
                    <label>Width</label>
                </div>
                <div class="field border  label">
                    <input type="number" id="cam_height" name="cam_height" value="{{cam_height}}" />
                    <label>Height</label>
                </div>
                <div class="field border  label">
                    <input type="number" id="cam_frate" name="cam_framerate" value="{{cam_framerate}}" />
                    <label>Framerate</label>
                </div>

            </fieldset>
            <center>
                <button type="reset" value="Reset">
                    <i>reset_settings</i>
                    <span>Reset</span>
                </button>
                <button type="submit" name="action" value="Set">
                    <i>rule_settings</i>
                    <span>Apply</span>
                </button>

                <button type="submit" name="action" value="Save">
                    <i>save</i>
                    <span>Save</span>
                </button>
            </center>

        </form>
       
    </main>
</body>
</html>
