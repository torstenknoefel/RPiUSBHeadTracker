<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    {{> head.html}}
</head>
<body>
    {{> menu.html}}
    <style>
        /* Show the whole camera picture: full width up to the camera's own size,
           height from the picture's aspect ratio, nothing cropped. */
        #camera {
            display: block;
            width: 100%;
            max-width: 640px;
            height: auto;
            object-fit: contain;
        }
    </style>
    <main class="responsive">
        <img src="/image" class="round" alt="Camera" id="camera">
    </main>
    <script>
        // Load the next picture only when the previous one has arrived, at most
        // about 10 per second. Requests never pile up on a slow connection, and
        // the picture is swapped only once it is complete (no flicker).
        const camera = document.getElementById("camera");
        const interval = 100; // ms between pictures
        let shown = null;     // object URL of the picture on screen

        async function load() {
            const started = Date.now();
            try {
                const response = await fetch("/image", { cache: "no-store" });
                if (!response.ok) throw new Error(response.status);
                const url = URL.createObjectURL(await response.blob());
                await new Promise((resolve, reject) => {
                    camera.onload = resolve;
                    camera.onerror = reject;
                    camera.src = url;
                });
                if (shown) URL.revokeObjectURL(shown);
                shown = url;
                setTimeout(load, Math.max(0, interval - (Date.now() - started)));
            } catch (e) {
                setTimeout(load, 1000); // camera not ready or program restarting
            }
        }
        load();
    </script>
</body>
</html>
