<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<body>
    {{> menu.html}}
    <main class="responsive">
        <img src="/image" class="responsive round medium-height" alt="Camera" id="myimg">
    </main>
        <script>
            var org = document.getElementById("myimg").src;

            setInterval(function () {
                refreshImg();
            }, 100);
            // 2000 = 2 seconds, change to whatever you like

            function refreshImg() {
                document.getElementById("myimg").src = org + '?' + new Date().getTime();
                // //var x = document.querySelectorAll("body > img");

                //console.log(x[i].src);
                // };
            }
        </script>
</body>
</html>
