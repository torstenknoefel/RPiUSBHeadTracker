<!-- What the tracker is doing right now: a plain status line, not a button.
     Pages call window.htTrackState(state) with /state's answer, or null when
     there is no connection. -->
<style>
    .track-state { display: flex; align-items: center; gap: 8px; margin: 0 0 12px 0; font-weight: 500; }
    .track-state i { color: var(--ts-color, #9e9e9e); }
    .track-state.ts-ok { --ts-color: #43a047; }
    .track-state.ts-wait { --ts-color: #fb8c00; }
    .track-state.ts-error { --ts-color: #e53935; }
</style>
<div class="track-state" id="track-state" role="status" aria-live="polite">
    <i id="ts-icon">hourglass_empty</i>
    <span id="ts-text">Waiting for the tracker …</span>
</div>
<script>
    window.htTrackState = s => {
        const [kind, icon, text] =
            !s ? ["error", "link_off", "No connection to the tracker"] :
            !s.face ? ["error", "face_retouching_off", "No face found"] :
            !s.centred ? ["wait", "center_focus_weak", "Setting the centre …"] :
            ["ok", "face", "Tracking your head"];
        const box = document.getElementById("track-state");
        box.className = "track-state ts-" + kind;
        document.getElementById("ts-icon").textContent = icon;
        document.getElementById("ts-text").textContent = text;
    };
</script>
