# Hotspot of the head tracker (see headtracker-wifi.sh): every name points to
# the tracker, so a phone that joins the hotspot opens the setup page by itself
# (its "is there internet?" check lands on the tracker's web server).
# Installed by install_wifi.sh into /etc/NetworkManager/dnsmasq-shared.d/;
# NetworkManager's DNS and DHCP server for shared connections reads it.
address=/#/10.42.0.1
