# Builds the Debian package (debian/) for 64-bit Raspberry Pi OS bookworm and
# trixie, installs it in a fresh container and checks the result.
#   - every pull request and push to master: the packages are kept as workflow
#     artifacts (Actions tab -> run -> Artifacts) for 14 days
#   - a version tag vX.Y.Z (must match project() VERSION in CMakeLists.txt): the
#     SD card image is built too (also when started by hand), and packages and
#     image are attached to a GitHub release of that tag
# Package versions get the Debian release: 0.1.0+deb12 (bookworm), 0.1.0+deb13 (trixie).
name: Package

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deb:
    name: Debian package (${{ matrix.os }})
    runs-on: ubuntu-24.04-arm
    container: debian:${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: bookworm
            suffix: deb12
          - os: trixie
            suffix: deb13
    steps:
      - name: Add the Raspberry Pi package source
        # see ci.yml: the 2025 keyring package has the key signed with SHA-256
        env:
          KEYRING_DEB: raspberrypi-archive-keyring_2025.1+rpt1_all.deb
          KEYRING_SHA256: 2e727149d7acb8cc7f604e66d0049161039c8aa1eaf1175e54f9e69d963d60e4
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          curl -fsSL -o /tmp/keyring.deb \
            "http://archive.raspberrypi.com/debian/pool/main/r/raspberrypi-archive-keyring/$KEYRING_DEB"
          echo "$KEYRING_SHA256  /tmp/keyring.deb" | sha256sum -c -
          dpkg -i /tmp/keyring.deb
          echo "deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.pgp] http://archive.raspberrypi.com/debian/ ${{ matrix.os }} main" \
            > /etc/apt/sources.list.d/raspi.list
          apt-get update

      - name: Install packaging tools and build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper git \
            cmake ninja-build g++ pkg-config \
            libopencv-dev libcamera-dev libasio-dev libgtest-dev

      - uses: actions/checkout@v7
        with:
          path: src

      - name: Package version for this Debian release
        working-directory: src
        run: |
          sed -i "1s/(\([^)]*\))/(\1+${{ matrix.suffix }})/" debian/changelog
          head -1 debian/changelog

      - name: Build the package
        working-directory: src
        run: dpkg-buildpackage -b -us -uc

      - name: Show the packages
        run: |
          ls -l *.deb
          for p in rpi-headtracker_*_arm64.deb rpi-headtracker-wifi_*_all.deb; do
            dpkg-deb -I "$p"
            dpkg-deb -c "$p"
          done

      - name: Install them in this container and check
        run: |
          apt-get install -y ./rpi-headtracker_*_arm64.deb ./rpi-headtracker-wifi_*_all.deb
          getent passwd headtracker
          id headtracker | grep -q '(video)'
          test -x /usr/bin/RPiUSBHeadTracker
          test -f /usr/share/rpi-headtracker/default.json
          test -f /usr/lib/udev/rules.d/60-rpi-headtracker.rules
          ls /usr/lib/systemd/system/rpi-headtracker.service /usr/lib/systemd/system/rpi-headtracker-gadget.service
          # (a line starting with "!" would never stop the step, hence the if)
          if ldd /usr/bin/RPiUSBHeadTracker | grep "not found"; then exit 1; fi
          # found through the RPATH, so ldd shows /usr/bin/../lib/rpi-headtracker/
          ldd /usr/bin/RPiUSBHeadTracker | grep -F "/usr/bin/../lib/rpi-headtracker/libonnxruntime.so.1"
          # starts and stops at the wrong data folder (no camera here)
          if /usr/bin/RPiUSBHeadTracker -d /nonexistent; then exit 1; fi
          # the Wi-Fi package
          test -x /usr/lib/rpi-headtracker/headtracker-wifi.sh
          test -x /usr/lib/rpi-headtracker/headtracker-portal.sh
          test -f /etc/NetworkManager/dnsmasq-shared.d/headtracker-captive.conf
          grep -q '"headtracker"' /usr/share/polkit-1/rules.d/10-rpi-headtracker-wifi.rules
          ls /usr/lib/systemd/system/rpi-headtracker-wifi.service \
             /usr/lib/systemd/system/rpi-headtracker-portal.socket \
             /usr/lib/systemd/system/rpi-headtracker-portal.service
          # the portal script finds the web server's port in the settings
          mkdir -p /tmp/portal && printf '{\n   "port": 18123\n}\n' > /tmp/portal/config.json
          # (sh -x prints the proxy command before it runs; without a socket it stops at once)
          HEADTRACKER_CONFIG=/tmp/portal/config.json sh -x /usr/lib/rpi-headtracker/headtracker-portal.sh 2>&1 \
            | grep -F "127.0.0.1:18123"
          apt-get purge -y rpi-headtracker-wifi rpi-headtracker
          test ! -e /usr/bin/RPiUSBHeadTracker
          test ! -e /usr/share/polkit-1/rules.d/10-rpi-headtracker-wifi.rules

      - uses: actions/upload-artifact@v7
        with:
          name: rpi-headtracker-${{ matrix.os }}
          path: |
            rpi-headtracker_*_arm64.deb
            rpi-headtracker-wifi_*_all.deb
          retention-days: 14

  # The SD card image (image/build.sh): Raspberry Pi OS Lite trixie + the trixie
  # packages from the job above. Takes a while, so only for version tags and when
  # started by hand (Actions tab -> Package -> Run workflow, on any branch).
  image:
    name: SD card image (trixie)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: deb
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: rpi-headtracker-trixie
          path: debs

      - name: Make room on the disk (pi-gen needs about 15 GB)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Build the image with pi-gen
        run: bash image/build.sh debs deploy

      - name: Checksum
        working-directory: deploy
        run: |
          sha256sum *.img.xz > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: headtracker-image
          path: |
            deploy/*.img.xz
            deploy/SHA256SUMS
          retention-days: 7
          compression-level: 0  # already xz

  release:
    name: Attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the project version
        run: |
          version=$(sed -n 's/^project *(RPiUSBHeadTracker VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "CMakeLists.txt: $version, tag: ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true  # all artifacts: both package sets and the image

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l *.deb *.img.xz SHA256SUMS
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "SD card image (write it with Raspberry Pi Imager: Choose OS -> Use custom) and Debian packages for 64-bit Raspberry Pi OS: +deb12 for bookworm, +deb13 for trixie. rpi-headtracker is the head tracker; rpi-headtracker-wifi adds the Wi-Fi setup without a terminal (own hotspot when on no network)."
          gh release upload "$GITHUB_REF_NAME" *.deb *.img.xz SHA256SUMS --clobber
